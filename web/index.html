<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Agvisely Admin — DAE advisory and user administration">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#678042">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agvisely Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Agvisely Admin</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F2F4F1; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #boot span { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #DDE4D4; border-top-color: #678042; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot span { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading"><span></span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
